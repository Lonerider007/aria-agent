[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aria-x"
version = "1.5.4"
description = "ARIA — Autonomous Reasoning and Intelligent Agent. Your project-aware coding partner."
authors = [{name = "Sumit", email = "samsungsumitv461@gmail.com"}]
readme = "README.md"
license = "LicenseRef-ARIA-Source-License"
requires-python = ">=3.10"
keywords = ["ai", "agent", "cli", "coding", "llm", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "openai>=1.102.0",
    "rich>=14.1.0",
    "prompt_toolkit>=3.0.50",
    "ddgs>=9.14.2",
]

[project.optional-dependencies]
web = ["fastapi>=0.111.0", "uvicorn[standard]>=0.29.0", "websockets>=12.0"]

[project.scripts]
aria = "aria.main:main"

[project.urls]
Homepage = "https://github.com/Lonerider007/aria-agent"

[tool.setuptools.packages.find]
where = ["."]
include = ["aria*"]
