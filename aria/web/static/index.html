<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ARIA</title>
<style>
:root {
  --bg:        #0D0D0D;
  --bg2:       #141414;
  --bg3:       #1C1C1C;
  --border:    #2A2A2A;
  --purple:    #7C3AED;
  --purple2:   #6D28D9;
  --cyan:      #06B6D4;
  --green:     #22C55E;
  --yellow:    #EAB308;
  --red:       #EF4444;
  --dim:       #6B7280;
  --text:      #E5E7EB;
  --text2:     #9CA3AF;
  --sidebar-w: 56px;
  --header-h:  48px;
  --input-h:   64px;
  --status-h:  28px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
  font-size: 14px;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── HEADER ─────────────────────────────────────────── */
#header {
  height: var(--header-h);
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 14px;
  gap: 12px;
  flex-shrink: 0;
  z-index: 10;
}

#logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  font-size: 15px;
  color: var(--purple);
  letter-spacing: 2px;
  user-select: none;
}

#logo-dot {
  width: 22px; height: 22px;
  border: 2px solid var(--purple);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px;
  color: var(--purple);
  animation: pulse-ring 2s ease-in-out infinite;
}

@keyframes pulse-ring {
  0%,100% { box-shadow: 0 0 0 0 rgba(124,58,237,.4); }
  50%      { box-shadow: 0 0 0 5px rgba(124,58,237,0); }
}

#header-sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }

#model-badge {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 3px 10px;
  font-size: 12px;
  color: var(--cyan);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 200px;
}

#status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--dim);
  flex-shrink: 0;
  transition: background .3s;
}
#status-dot.online  { background: var(--green); box-shadow: 0 0 6px var(--green); }
#status-dot.working { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }
#status-dot.error   { background: var(--red); }

#header-spacer { flex: 1; }

#token-count {
  font-size: 11px;
  color: var(--dim);
  white-space: nowrap;
}

#session-toggle {
  background: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--dim);
  font-size: 11px;
  padding: 3px 8px;
  cursor: pointer;
  font-family: inherit;
  transition: all .15s;
}
#session-toggle:hover { border-color: var(--purple); color: var(--purple); }

/* ── BODY (sidebar + main + timeline) ───────────────── */
#body {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* ── SIDEBAR ─────────────────────────────────────────── */
#sidebar {
  width: var(--sidebar-w);
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 10px 0;
  gap: 4px;
  flex-shrink: 0;
}

.nav-btn {
  width: 40px; height: 40px;
  border-radius: 8px;
  border: none;
  background: none;
  color: var(--dim);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px;
  transition: all .15s;
  position: relative;
}
.nav-btn:hover        { background: var(--bg3); color: var(--text); }
.nav-btn.active       { background: rgba(124,58,237,.15); color: var(--purple); }
.nav-btn .tooltip {
  position: absolute;
  left: 48px; top: 50%;
  transform: translateY(-50%);
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 8px;
  font-size: 11px;
  white-space: nowrap;
  color: var(--text);
  pointer-events: none;
  opacity: 0;
  transition: opacity .15s;
  z-index: 100;
}
.nav-btn:hover .tooltip { opacity: 1; }

#sidebar-spacer { flex: 1; }

/* ── MAIN AREA ───────────────────────────────────────── */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── CHAT ────────────────────────────────────────────── */
#chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scroll-behavior: smooth;
}
#chat::-webkit-scrollbar { width: 4px; }
#chat::-webkit-scrollbar-track { background: transparent; }
#chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* Welcome message */
#welcome {
  text-align: center;
  padding: 40px 20px;
  color: var(--dim);
}
#welcome .big-logo {
  font-size: 32px;
  font-weight: 700;
  color: var(--purple);
  letter-spacing: 8px;
  margin-bottom: 8px;
}
#welcome .tagline { font-size: 12px; line-height: 1.6; }

/* Messages */
.msg { display: flex; flex-direction: column; max-width: 100%; }

.msg.user {
  align-items: flex-end;
}
.msg.user .bubble {
  background: rgba(124,58,237,.2);
  border: 1px solid rgba(124,58,237,.3);
  border-radius: 12px 12px 2px 12px;
  padding: 10px 14px;
  max-width: min(75%, 600px);
  color: var(--text);
  line-height: 1.5;
  word-break: break-word;
}

.msg.aria { align-items: flex-start; }
.msg.aria .bubble {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 2px 12px 12px 12px;
  padding: 12px 16px;
  max-width: min(85%, 700px);
  line-height: 1.6;
  word-break: break-word;
}

.msg-meta {
  font-size: 10px;
  color: var(--dim);
  margin: 3px 4px;
}

/* Tool events */
.tool-event {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 5px 10px;
  background: rgba(6,182,212,.04);
  border-left: 2px solid rgba(6,182,212,.3);
  border-radius: 0 6px 6px 0;
  font-size: 12px;
  color: var(--cyan);
  margin: 2px 0;
}
.tool-event .step { color: var(--dim); min-width: 22px; }
.tool-event .phrase { color: var(--text2); }

.tool-output {
  padding: 4px 10px 4px 20px;
  font-size: 11px;
  color: var(--dim);
  border-left: 2px solid var(--border);
  margin: 1px 0 4px 0;
  white-space: pre-wrap;
  font-family: inherit;
  max-height: 120px;
  overflow-y: auto;
}

/* Thinking indicator */
.thinking {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 4px;
  color: var(--dim);
  font-size: 12px;
}
.thinking .dots span {
  display: inline-block;
  width: 5px; height: 5px;
  background: var(--purple);
  border-radius: 50%;
  animation: dot-bounce .8s ease-in-out infinite;
  margin: 0 1px;
}
.thinking .dots span:nth-child(2) { animation-delay: .15s; }
.thinking .dots span:nth-child(3) { animation-delay: .30s; }
@keyframes dot-bounce {
  0%,80%,100% { transform: scale(.6); opacity:.4; }
  40%          { transform: scale(1);  opacity:1; }
}

/* Streaming cursor */
.cursor {
  display: inline-block;
  width: 2px; height: 14px;
  background: var(--purple);
  margin-left: 1px;
  vertical-align: middle;
  animation: blink .8s step-end infinite;
}
@keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0; } }

/* Plan card */
.plan-card {
  background: var(--bg2);
  border: 1px solid var(--purple);
  border-radius: 10px;
  padding: 14px 16px;
  max-width: min(85%, 640px);
}
.plan-card .plan-title {
  color: var(--purple);
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 6px;
  letter-spacing: 1px;
}
.plan-card .plan-goal {
  color: var(--text2);
  font-size: 12px;
  margin-bottom: 10px;
}
.plan-card .plan-steps { list-style: none; margin-bottom: 12px; }
.plan-card .plan-steps li {
  display: flex;
  gap: 8px;
  padding: 3px 0;
  font-size: 12px;
  color: var(--text);
}
.plan-card .plan-steps li .n { color: var(--purple); min-width: 18px; }

.plan-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-approve {
  background: rgba(34,197,94,.15);
  border: 1px solid rgba(34,197,94,.4);
  color: var(--green);
  border-radius: 6px;
  padding: 6px 16px;
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  transition: all .15s;
}
.btn-approve:hover { background: rgba(34,197,94,.25); }

.btn-reject {
  background: rgba(239,68,68,.1);
  border: 1px solid rgba(239,68,68,.3);
  color: var(--red);
  border-radius: 6px;
  padding: 6px 16px;
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  transition: all .15s;
}
.btn-reject:hover { background: rgba(239,68,68,.2); }

/* Question card */
.question-card {
  background: var(--bg2);
  border: 1px solid var(--yellow);
  border-radius: 10px;
  padding: 14px 16px;
  max-width: min(85%, 600px);
}
.question-card .q-label {
  color: var(--yellow);
  font-size: 11px;
  margin-bottom: 6px;
}
.question-card .q-text { font-size: 13px; margin-bottom: 10px; color: var(--text); }
.question-card .q-input {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 7px 10px;
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  margin-bottom: 8px;
  outline: none;
}
.question-card .q-input:focus { border-color: var(--yellow); }
.btn-answer {
  background: rgba(234,179,8,.15);
  border: 1px solid rgba(234,179,8,.4);
  color: var(--yellow);
  border-radius: 6px;
  padding: 6px 16px;
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
}

/* Approval card */
.approval-card {
  background: var(--bg2);
  border: 1px solid var(--red);
  border-radius: 10px;
  padding: 14px 16px;
  max-width: min(85%, 600px);
}
.approval-card .ap-label { color: var(--red); font-size: 11px; margin-bottom: 6px; }
.approval-card .ap-action {
  background: var(--bg3);
  border-radius: 6px;
  padding: 8px 10px;
  font-size: 12px;
  color: var(--text2);
  margin-bottom: 10px;
  white-space: pre-wrap;
  word-break: break-all;
}

/* Markdown in response */
.aria .bubble pre {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
  margin: 8px 0;
  overflow-x: auto;
  font-size: 12px;
  line-height: 1.5;
}
.aria .bubble code {
  background: var(--bg3);
  border-radius: 3px;
  padding: 1px 4px;
  font-size: 12px;
  color: var(--cyan);
}
.aria .bubble pre code { background: none; padding: 0; color: var(--text); }
.aria .bubble p  { margin: 6px 0; }
.aria .bubble ul, .aria .bubble ol { margin: 6px 0 6px 18px; }
.aria .bubble li { margin: 2px 0; }
.aria .bubble strong { color: var(--text); }
.aria .bubble h1,.aria .bubble h2,.aria .bubble h3 {
  color: var(--purple); margin: 10px 0 4px 0; font-size: 14px;
}

/* Notify */
.notify {
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 12px;
  display: flex; gap: 8px; align-items: center;
}
.notify.info    { background: rgba(6,182,212,.08);  color: var(--cyan);   border-left: 3px solid var(--cyan); }
.notify.success { background: rgba(34,197,94,.08);  color: var(--green);  border-left: 3px solid var(--green); }
.notify.warning { background: rgba(234,179,8,.08);  color: var(--yellow); border-left: 3px solid var(--yellow); }
.notify.error   { background: rgba(239,68,68,.08);  color: var(--red);    border-left: 3px solid var(--red); }

/* ── INPUT BAR ───────────────────────────────────────── */
#input-bar {
  border-top: 1px solid var(--border);
  padding: 10px 12px;
  background: var(--bg2);
  display: flex;
  align-items: flex-end;
  gap: 8px;
  flex-shrink: 0;
}

#msg-input {
  flex: 1;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  resize: none;
  outline: none;
  min-height: 42px;
  max-height: 140px;
  line-height: 1.4;
  transition: border-color .15s;
}
#msg-input:focus  { border-color: var(--purple); }
#msg-input::placeholder { color: var(--dim); }

#send-btn {
  width: 40px; height: 40px;
  border-radius: 10px;
  background: var(--purple);
  border: none;
  color: white;
  font-size: 16px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background .15s;
}
#send-btn:hover    { background: var(--purple2); }
#send-btn:disabled { background: var(--bg3); color: var(--dim); cursor: not-allowed; }

/* ── STATUS BAR ──────────────────────────────────────── */
#status-bar {
  height: var(--status-h);
  background: var(--bg2);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 16px;
  font-size: 11px;
  color: var(--dim);
  flex-shrink: 0;
  overflow: hidden;
}
.sb-item { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.sb-item .label { color: var(--dim); }
.sb-item .val   { color: var(--text2); }
#sb-status-text { color: var(--dim); }
#sb-spacer { flex: 1; }

/* ── SESSION TIMELINE PANEL ──────────────────────────── */
#timeline-panel {
  width: 220px;
  background: var(--bg2);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transition: width .2s ease;
  overflow: hidden;
}
#timeline-panel.collapsed { width: 0; border-left: none; }

#timeline-header {
  padding: 10px 12px;
  font-size: 11px;
  color: var(--dim);
  border-bottom: 1px solid var(--border);
  letter-spacing: 1px;
  flex-shrink: 0;
  white-space: nowrap;
}

#timeline-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}
#timeline-list::-webkit-scrollbar { width: 3px; }
#timeline-list::-webkit-scrollbar-thumb { background: var(--border); }

.tl-item {
  padding: 5px 12px;
  display: flex;
  flex-direction: column;
  gap: 1px;
  border-left: 2px solid transparent;
  transition: border-color .1s;
}
.tl-item:hover { border-left-color: var(--purple); background: rgba(124,58,237,.04); }
.tl-item .tl-time { font-size: 10px; color: var(--dim); }
.tl-item .tl-event { font-size: 11px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ── MOBILE ──────────────────────────────────────────── */
@media (max-width: 640px) {
  #sidebar         { display: none; }
  #timeline-panel  { display: none; }
  #session-toggle  { display: none; }
  #model-badge     { max-width: 130px; font-size: 11px; }
  #token-count     { display: none; }
  #msg-input       { font-size: 16px; } /* prevent iOS zoom */
  #chat            { padding: 12px 10px; }
  .msg.user .bubble    { max-width: 85%; }
  .msg.aria .bubble    { max-width: 92%; }
}

/* ── SLASH COMMAND HINT ───────────────────────────────── */
#cmd-hint {
  display: none;
  position: absolute;
  bottom: calc(var(--input-h) + var(--status-h) + 8px);
  left: calc(var(--sidebar-w) + 8px);
  right: 8px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 0;
  z-index: 50;
  max-height: 200px;
  overflow-y: auto;
}
#cmd-hint.visible { display: block; }
.cmd-item {
  padding: 5px 12px;
  font-size: 12px;
  cursor: pointer;
  display: flex; gap: 10px; align-items: center;
}
.cmd-item:hover { background: rgba(124,58,237,.1); }
.cmd-item .cmd  { color: var(--cyan); min-width: 80px; }
.cmd-item .desc { color: var(--dim); }
</style>
</head>
<body>

<!-- HEADER -->
<div id="header">
  <div id="logo">
    <div id="logo-dot">◉</div>
    ARIA
  </div>
  <div id="header-sep"></div>
  <div id="model-badge" id="model-label">connecting...</div>
  <div id="status-dot"></div>
  <div id="header-spacer"></div>
  <div id="token-count">↑ 0 tokens</div>
  <button id="session-toggle" onclick="toggleTimeline()">Timeline</button>
</div>

<!-- BODY -->
<div id="body">

  <!-- SIDEBAR -->
  <div id="sidebar">
    <button class="nav-btn active" title="Chat">
      💬<span class="tooltip">Chat</span>
    </button>
    <button class="nav-btn" title="History">
      📜<span class="tooltip">History</span>
    </button>
    <button class="nav-btn" title="Files">
      📁<span class="tooltip">Files</span>
    </button>
    <div id="sidebar-spacer"></div>
    <button class="nav-btn" title="Settings">
      ⚙️<span class="tooltip">Settings</span>
    </button>
  </div>

  <!-- MAIN -->
  <div id="main">
    <div id="chat">
      <div id="welcome">
        <div class="big-logo">A R I A</div>
        <div class="tagline">
          Autonomous Reasoning and Intelligent Agent<br>
          <span style="color:var(--dim);font-size:11px">Project-aware · Recovery-restarting · Reason before action</span>
        </div>
      </div>
    </div>

    <!-- CMD HINT -->
    <div id="cmd-hint"></div>

    <div id="input-bar">
      <textarea id="msg-input" rows="1" placeholder="Ask anything... (/ for commands)"
        oninput="autoResize(this); showCmdHint(this.value)"
        onkeydown="handleKey(event)"></textarea>
      <button id="send-btn" onclick="sendMessage()" title="Send">➤</button>
    </div>
  </div>

  <!-- TIMELINE PANEL -->
  <div id="timeline-panel">
    <div id="timeline-header">◉ SESSION TIMELINE</div>
    <div id="timeline-list"></div>
  </div>

</div>

<!-- STATUS BAR -->
<div id="status-bar">
  <div class="sb-item"><span class="label">◉</span><span class="val" id="sb-workspace">—</span></div>
  <div class="sb-item"><span class="label">model</span><span class="val" id="sb-model">—</span></div>
  <div id="sb-spacer"></div>
  <div id="sb-status-text">connecting...</div>
  <div class="sb-item">v1.4.2</div>
</div>

<script>
// ── State ────────────────────────────────────────────────────────────────────
let ws, agentBusy = false, streamingEl = null, tokenCount = 0;
let timelineItems = [];
const COMMANDS = [
  {cmd:'/fix',     desc:'Fix bugs in current project'},
  {cmd:'/test',    desc:'Run tests and fix failures'},
  {cmd:'/commit',  desc:'Smart git commit'},
  {cmd:'/review',  desc:'Code review'},
  {cmd:'/explain', desc:'Explain code'},
  {cmd:'/status',  desc:'Session info'},
  {cmd:'/history', desc:'Session timeline'},
  {cmd:'/memory',  desc:'Show project memory'},
  {cmd:'/clear',   desc:'Clear conversation'},
];

// ── WebSocket ─────────────────────────────────────────────────────────────────
function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws`);

  ws.onopen = () => setStatus('online', 'Connected');

  ws.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    handleEvent(ev);
  };

  ws.onclose = () => {
    setStatus('error', 'Reconnecting...');
    setSendEnabled(false);
    setTimeout(connect, 2000);
  };

  ws.onerror = () => setStatus('error', 'Connection error');
}

function handleEvent(ev) {
  switch (ev.type) {

    case 'connected':
      document.getElementById('model-badge').textContent = ev.model;
      document.getElementById('sb-model').textContent = ev.model;
      const ws_short = ev.workspace ? ev.workspace.split('/').pop() : '—';
      document.getElementById('sb-workspace').textContent = ws_short;
      setStatus('online', 'Ready');
      setSendEnabled(true);
      addTimeline('Connected', ev.model);
      break;

    case 'thinking':
      showThinking();
      setStatus('working', 'Thinking...');
      break;

    case 'token':
      appendToken(ev.text);
      tokenCount += ev.text.length >> 2;
      document.getElementById('token-count').textContent = `↑ ${fmtTokens(tokenCount)} tokens`;
      break;

    case 'tool':
      finishStreaming();
      appendToolEvent(ev.step, ev.phrase);
      setStatus('working', ev.phrase);
      break;

    case 'tool_output':
      appendToolOutput(ev.text, ev.step);
      break;

    case 'notify':
      finishStreaming();
      appendNotify(ev.text, ev.level || 'info');
      break;

    case 'plan':
      finishStreaming();
      appendPlan(ev.goal, ev.steps);
      setStatus('working', 'Waiting for approval...');
      break;

    case 'question':
      finishStreaming();
      appendQuestion(ev.text);
      setStatus('working', 'Waiting for answer...');
      break;

    case 'approval':
      finishStreaming();
      appendApproval(ev.action);
      setStatus('working', 'Waiting for approval...');
      break;

    case 'done':
      finishStreaming();
      agentBusy = false;
      setSendEnabled(true);
      setStatus('online', 'Ready');
      addTimeline('Task complete', new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}));
      break;

    case 'error':
      finishStreaming();
      appendNotify(ev.text, 'error');
      agentBusy = false;
      setSendEnabled(true);
      setStatus('error', 'Error');
      break;
  }
}

// ── Send ──────────────────────────────────────────────────────────────────────
function sendMessage() {
  const inp = document.getElementById('msg-input');
  const text = inp.value.trim();
  if (!text || agentBusy || !ws || ws.readyState !== 1) return;

  hideCmdHint();
  appendUserMsg(text);
  addTimeline('Task: ' + text.slice(0, 40), new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}));

  inp.value = '';
  autoResize(inp);
  agentBusy = true;
  setSendEnabled(false);

  ws.send(JSON.stringify({type: 'message', text}));
}

function sendResponse(value) {
  ws.send(JSON.stringify({type: 'response', value}));
}

// ── DOM helpers ───────────────────────────────────────────────────────────────
function scrollChat() {
  const c = document.getElementById('chat');
  c.scrollTop = c.scrollHeight;
}

function appendUserMsg(text) {
  const chat = document.getElementById('chat');
  removeWelcome();
  const d = document.createElement('div');
  d.className = 'msg user';
  d.innerHTML = `<div class="bubble">${escHtml(text)}</div>
    <div class="msg-meta">${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>`;
  chat.appendChild(d);
  scrollChat();
}

function showThinking() {
  finishStreaming();
  const chat = document.getElementById('chat');
  removeWelcome();
  const d = document.createElement('div');
  d.className = 'thinking';
  d.id = 'thinking-ind';
  d.innerHTML = `<div class="dots"><span></span><span></span><span></span></div><span>Thinking...</span>`;
  chat.appendChild(d);
  scrollChat();
}

function appendToken(text) {
  document.getElementById('thinking-ind')?.remove();
  const chat = document.getElementById('chat');

  if (!streamingEl) {
    const d = document.createElement('div');
    d.className = 'msg aria';
    d.innerHTML = `<div class="bubble" id="streaming-bubble"></div>
      <div class="msg-meta">ARIA</div>`;
    chat.appendChild(d);
    streamingEl = document.getElementById('streaming-bubble');
    streamingEl._raw = '';
  }
  streamingEl._raw += text;
  streamingEl.innerHTML = renderMd(streamingEl._raw) + '<span class="cursor"></span>';
  scrollChat();
}

function finishStreaming() {
  document.getElementById('thinking-ind')?.remove();
  if (streamingEl) {
    streamingEl.innerHTML = renderMd(streamingEl._raw);
    streamingEl.id = '';
    streamingEl = null;
  }
}

function appendToolEvent(step, phrase) {
  const chat = document.getElementById('chat');
  const d = document.createElement('div');
  d.className = 'tool-event';
  d.dataset.step = step;
  d.innerHTML = `<span class="step">${step}.</span><span class="phrase">${escHtml(phrase)}</span>`;
  chat.appendChild(d);
  scrollChat();
}

function appendToolOutput(text, step) {
  const chat = document.getElementById('chat');
  const d = document.createElement('div');
  d.className = 'tool-output';
  d.textContent = text;
  chat.appendChild(d);
  scrollChat();
}

function appendNotify(text, level) {
  const chat = document.getElementById('chat');
  const icons = {info:'◉', success:'✓', warning:'⚠', error:'✗'};
  const d = document.createElement('div');
  d.className = `notify ${level}`;
  d.innerHTML = `<span>${icons[level]||'◉'}</span><span>${escHtml(text)}</span>`;
  chat.appendChild(d);
  scrollChat();
}

function appendPlan(goal, steps) {
  const chat = document.getElementById('chat');
  const stepsHtml = steps.map((s,i)=>`<li><span class="n">${i+1}.</span>${escHtml(s)}</li>`).join('');
  const d = document.createElement('div');
  d.className = 'msg aria';
  const uid = 'plan_' + Date.now();
  d.innerHTML = `<div class="plan-card">
    <div class="plan-title">◉ PLAN</div>
    ${goal ? `<div class="plan-goal">${escHtml(goal)}</div>` : ''}
    <ul class="plan-steps">${stepsHtml}</ul>
    <div class="plan-actions">
      <button class="btn-approve" onclick="respondPlan('APPROVED', '${uid}')">✓ Approve</button>
      <button class="btn-reject"  onclick="respondPlan('USER_REJECTED: user declined.', '${uid}')">✗ Reject</button>
    </div>
  </div>`;
  d.id = uid;
  chat.appendChild(d);
  scrollChat();
}

function respondPlan(value, uid) {
  document.getElementById(uid)?.querySelector('.plan-actions')?.remove();
  sendResponse(value);
}

function appendQuestion(text) {
  const chat = document.getElementById('chat');
  const uid = 'q_' + Date.now();
  const d = document.createElement('div');
  d.className = 'msg aria';
  d.id = uid;
  d.innerHTML = `<div class="question-card">
    <div class="q-label">? ARIA asks</div>
    <div class="q-text">${escHtml(text)}</div>
    <input class="q-input" id="qinput_${uid}" placeholder="Your answer..."
      onkeydown="if(event.key==='Enter'){respondQuestion('${uid}');}">
    <button class="btn-answer" onclick="respondQuestion('${uid}')">Answer</button>
  </div>`;
  chat.appendChild(d);
  document.getElementById(`qinput_${uid}`)?.focus();
  scrollChat();
}

function respondQuestion(uid) {
  const inp = document.getElementById(`qinput_${uid}`);
  const val = inp?.value.trim() || '(no answer)';
  document.getElementById(uid)?.querySelector('.question-card')?.remove();
  const d = document.getElementById(uid);
  if(d) d.innerHTML = `<div class="bubble">${escHtml(val)}</div>`;
  sendResponse(val);
}

function appendApproval(action) {
  const chat = document.getElementById('chat');
  const uid = 'ap_' + Date.now();
  const d = document.createElement('div');
  d.className = 'msg aria';
  d.id = uid;
  d.innerHTML = `<div class="approval-card">
    <div class="ap-label">⚠ APPROVAL REQUIRED</div>
    <div class="ap-action">${escHtml(action)}</div>
    <div class="plan-actions">
      <button class="btn-approve" onclick="respondApproval('APPROVED','${uid}')">✓ Allow</button>
      <button class="btn-reject"  onclick="respondApproval('DENIED: user cancelled.','${uid}')">✗ Deny</button>
    </div>
  </div>`;
  chat.appendChild(d);
  scrollChat();
}

function respondApproval(value, uid) {
  document.getElementById(uid)?.querySelector('.plan-actions')?.remove();
  sendResponse(value);
}

// ── Timeline ──────────────────────────────────────────────────────────────────
function addTimeline(event, time) {
  timelineItems.unshift({event, time});
  if (timelineItems.length > 50) timelineItems.pop();
  renderTimeline();
}

function renderTimeline() {
  const list = document.getElementById('timeline-list');
  list.innerHTML = timelineItems.map(i => `
    <div class="tl-item">
      <span class="tl-time">${i.time}</span>
      <span class="tl-event">${escHtml(i.event)}</span>
    </div>`).join('');
}

function toggleTimeline() {
  const panel = document.getElementById('timeline-panel');
  panel.classList.toggle('collapsed');
}

// ── Slash commands hint ───────────────────────────────────────────────────────
function showCmdHint(val) {
  const hint = document.getElementById('cmd-hint');
  if (!val.startsWith('/')) { hideCmdHint(); return; }
  const q = val.toLowerCase();
  const matches = COMMANDS.filter(c => c.cmd.startsWith(q));
  if (!matches.length) { hideCmdHint(); return; }
  hint.innerHTML = matches.map(c =>
    `<div class="cmd-item" onclick="selectCmd('${c.cmd}')">
      <span class="cmd">${c.cmd}</span><span class="desc">${c.desc}</span>
    </div>`).join('');
  hint.classList.add('visible');
}

function hideCmdHint() {
  document.getElementById('cmd-hint').classList.remove('visible');
}

function selectCmd(cmd) {
  const inp = document.getElementById('msg-input');
  inp.value = cmd + ' ';
  inp.focus();
  hideCmdHint();
}

// ── Utilities ─────────────────────────────────────────────────────────────────
function setStatus(type, text) {
  const dot = document.getElementById('status-dot');
  dot.className = 'status-dot ' + type;
  document.getElementById('sb-status-text').textContent = text;
}

function setSendEnabled(en) {
  document.getElementById('send-btn').disabled = !en;
  document.getElementById('msg-input').disabled = !en;
}

function removeWelcome() {
  document.getElementById('welcome')?.remove();
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    hideCmdHint();
    sendMessage();
  }
  if (e.key === 'Escape') hideCmdHint();
}

function fmtTokens(n) {
  return n >= 1000 ? (n/1000).toFixed(1) + 'k' : String(n);
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function renderMd(text) {
  // code blocks
  text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_,lang,code) =>
    `<pre><code>${escHtml(code.trim())}</code></pre>`);
  // inline code
  text = text.replace(/`([^`]+)`/g, (_,c) => `<code>${escHtml(c)}</code>`);
  // bold
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // headers
  text = text.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  text = text.replace(/^## (.+)$/gm,  '<h2>$1</h2>');
  text = text.replace(/^# (.+)$/gm,   '<h1>$1</h1>');
  // unordered list
  text = text.replace(/^[-*] (.+)$/gm, '<li>$1</li>');
  text = text.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
  // paragraphs
  text = text.split(/\n\n+/).map(p =>
    p.startsWith('<') ? p : `<p>${p.replace(/\n/g,'<br>')}</p>`
  ).join('');
  return text;
}

setSendEnabled(false);
setStatus('', 'Connecting...');
connect();
